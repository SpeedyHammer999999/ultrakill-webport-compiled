<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/64daysofstarman/ultrakill-webport-compiled/refs/heads/main/images/favicon.png">

  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <title>Unity WebGL Player | ULTRAKILL WEB PORT</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231F20;
    }

    #unity-canvas {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      display: block;
    }
  </style>
</head>

<body>

  <canvas id="unity-canvas"></canvas>

  <script src="Build/ultrakill.loader.js"></script>

  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/ultrakill.data.unityweb",
      frameworkUrl: "Build/ultrakill.framework.js.unityweb",
      codeUrl: "Build/ultrakill.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",

      companyName: "Hakita and Cake Logic",
      productName: "ULTRAKILL WEB PORT",
      productVersion: "1.4",

      matchWebGLToCanvasSize: true,
      devicePixelRatio: 1
    });
  </script>

</body>
</html>
